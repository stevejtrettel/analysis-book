title: Reaching for Infinity
subtitle: a first course in analysis
author: Steve Trettel
figure: fig-radius-of-convergence
blurb: >-
  A first course in real analysis, told as the story of infinite
  processes: why we need them, how they fail, and the ideas —
  completeness, convergence, uniformity — that make them safe to use.

# Two parts this year: Numbers (Ch 1-6) and Functions (Ch 7-13); Part III
# is deferred. Shape authorities: plan/new/part1-chapters.md and
# plan/new/part2-chapters.md, with per-chapter purpose-chN.md files.
# Chapter titles below are the PLAN'S INTERNAL SHORTHANDS, not titles.

# Unnumbered front matter: no chapter number, roman folios in print, its own
# group at the top of the contents. Notation is plan/new/purpose-ch0.md.
