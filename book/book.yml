title: Reaching for Infinity
author: Steve Trettel
figure: fig-radius-of-convergence
blurb: >-
  A first course in real analysis, told as the story of infinite
  processes: why we need them, how they fail, and the ideas —
  completeness, convergence, uniformity — that make them safe to use.

