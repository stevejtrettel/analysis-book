# example netlify.toml
[build]
  command = "# no build command"
  functions = "netlify/functions"
  publish = "dist"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://ntl.fyi/file-based-build-config

# stats.json is read by stevejtrettel.site at ITS build time to render this
# book's stats line. It must not be cached hard: the site only sees a new
# number when it rebuilds AND the CDN hands over a fresh copy, so a long
# max-age here would freeze the numbers on the website. Minutes, not months.
[[headers]]
  for = "/stats.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300, must-revalidate"
