title: Course Notes
author: Steve Trettel
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    common:
      filters:
        - tikzcd.lua
    html:
      theme: cosmo
      css: styles.css
      toc: true
      smooth-scroll: true
      citations-hover: true
      footnotes-hover: true
      callout-icon: false
    pdf:
      documentclass: scrbook
      fontfamily: libertinus
      fontsize: 10pt
      toc: true
      toc-depth: 3
      number-depth: 1
      include-in-header:
        - preamble.tex
        - fonts.tex
        - spacing.tex
      geometry:
        - paperwidth=6.25in
        - paperheight=9.25in
        - textwidth=4.5in
        - textheight=7.25in
        - left=0.75in
        - right=0.75in
        - top=0.75in
        - bottom=1in
      keep-tex: true