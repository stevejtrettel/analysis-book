title: Course Notes
author: Steve Trettel
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    common:
      filters:
        - tikzcd.lua
    html:
      theme: cosmo
      css: styles.css
      toc: true
      smooth-scroll: true
      citations-hover: true
      footnotes-hover: true
      callout-icon: false
    pdf:
      documentclass: scrbook
      fontfamily: libertinus
      fontsize: 10pt
      toc: true
      toc-depth: 2
      include-in-header:
        - preamble.tex
      geometry:
        - letterpaper
        - left=1.5in
        - right=1.5in
        - top=1.25in
        - bottom=1.25in
      keep-tex: true